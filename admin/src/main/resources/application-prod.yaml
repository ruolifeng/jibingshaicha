server:
  port: 5214
  servlet:
    context-path: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/disease_monitor3?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: disease_monitor3
    password: GNKTtzExjRyBptXa
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # 生产关闭 SQL 日志，避免大表查询时 stdout 刷屏拖慢接口
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# 生产环境关闭 Mapper/JDBC 调试日志
logging:
  level:
    cn.luyou.mapper: warn
    com.baomidou.mybatisplus: warn

# JWT 配置
jwt:
  # 签名密钥：生产部署时通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:your-secret-key-please-change-in-production}
  # Token 有效期（毫秒），默认 7 天
  expire: 604800000

# Knife4j 文档
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  upload:
    dir: ./data/uploads
  snowflake:
    worker-id: 1
    datacenter-id: 1
  # 仅停机迁移存量自增 ID → 雪花 ID 时设为 true，跑完必须改回 false
  migrate-snowflake-ids: false

