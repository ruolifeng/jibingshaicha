server:
  port: 5214
  servlet:
    context-path: /api/v1

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/disease_monitor3?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: disease_monitor3
    password: GNKTtzExjRyBptXa
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # 日志输出（开发时可打印 SQL，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 签名密钥：生产部署时通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:your-secret-key-please-change-in-production}
  # Token 有效期（毫秒），默认 7 天
  expire: 604800000

# Knife4j 文档
knife4j:
  enable: true
  setting:
    language: zh_cn

